name: Cineplex Ticket Checker (30-Sec Interval)

on:
  schedule:
    # Trigger workflow every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run 30-Second Loop for 5 Minutes
        env:
          AUTH_TOKEN: "${{ secrets.AUTH_TOKEN }}"
          CINEPLEX_EMAIL: "${{ secrets.CINEPLEX_EMAIL }}"
          CINEPLEX_PASSWORD: "${{ secrets.CINEPLEX_PASSWORD }}"
          TARGET_MOVIES: "${{ secrets.TARGET_MOVIES }}"
          TARGET_DATES: "${{ secrets.TARGET_DATES }}"
          TARGET_LOCATIONS: "${{ secrets.TARGET_LOCATIONS }}"
          TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          python -c "
          import time
          from checker import run_checker_once
          
          # Perform 10 checks spaced 30 seconds apart (total 5 minutes)
          for i in range(10):
              print(f'--- Cloud Check Iteration {i+1}/10 ---')
              found = run_checker_once()
              if found:
                  print('🎉 Match found! Notification dispatched.')
              time.sleep(30)
          "
