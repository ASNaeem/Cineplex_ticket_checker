name: Cineplex Ticket Checker (30-Sec Interval)

on:
  schedule:
    # Trigger workflow every 5 minutes automatically
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [check_tickets]

concurrency:
  group: cineplex-ticket-checker
  cancel-in-progress: true

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run 30-Second Loop for 5 Minutes
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONUNBUFFERED: "1"
          AUTH_TOKEN: "${{ secrets.AUTH_TOKEN }}"
          CINEPLEX_EMAIL: "${{ secrets.CINEPLEX_EMAIL }}"
          CINEPLEX_PASSWORD: "${{ secrets.CINEPLEX_PASSWORD }}"
          TARGET_MOVIES: "${{ vars.TARGET_MOVIES || secrets.TARGET_MOVIES || 'Spider-Man: Brand New Day' }}"
          TARGET_DATES: "${{ vars.TARGET_DATES || secrets.TARGET_DATES || '2026-08-04' }}"
          TARGET_LOCATIONS: "${{ vars.TARGET_LOCATIONS || secrets.TARGET_LOCATIONS || 'ALL' }}"
          TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          python .github/run_cloud.py
